<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SZMeetups · Agent Mirror — What's on in Shenzhen</title>
<meta name="description" content="Unofficial agent-friendly mirror of szmeetups.com: Shenzhen meetups, shows, nightlife, exhibitions and festivals as structured data (events.json + RSS + ICS), updated daily.">
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#101828;--mut:#667085;--line:#e7e7e3;--red:#d92d20;--blue:#175cd3;--green:#027a48;--amber:#b54708;--radius:18px;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px}
header{color:#fff;padding:20px 0 16px;background:radial-gradient(640px 320px at 12% -10%,rgba(217,45,32,.30),transparent 62%),radial-gradient(760px 380px at 88% 0%,rgba(23,92,211,.34),transparent 62%),#0a0c10}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
header h1{font-size:1.45rem;font-weight:850;margin:0;letter-spacing:.01em;display:inline}
header h1 .mirror{color:#ffd60a}
.langseg{flex:0 0 auto;display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;gap:2px}
.langseg button{border:0;background:none;font-family:inherit;font-size:.85rem;font-weight:700;color:#c3cad6;border-radius:999px;padding:4px 13px;cursor:pointer;min-height:30px}
.langseg button.on{background:#fff;color:#0a0c10;font-weight:850}
.tagline{color:#a7b0bf;font-size:.88rem;margin:4px 0 0;line-height:1.55}
.tagline b{color:#eef1f6}
.statsline{font-size:.8rem;color:#9aa3b2;margin-top:8px;font-variant-numeric:tabular-nums}
.statsline b{color:#eef1f6;font-weight:800}
.agentbar{background:linear-gradient(90deg,#b54708,#d92d20);color:#fff}
.agentbar .wrap{display:flex;gap:12px;align-items:center;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.agentbar p{margin:0;font-size:.88rem;flex:1;min-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agentbar button{flex:0 0 auto;background:#fff;color:#7a2e0e;border:0;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer;min-height:32px;font-size:.85rem;font-family:inherit}
.bar{position:sticky;top:0;z-index:20;background:rgba(246,246,244,.94);backdrop-filter:blur(10px);padding:10px 0 8px;margin:0 -24px;padding-left:24px;padding-right:24px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:9px}
.tab{border:0;background:none;font-family:inherit;font-size:.95rem;font-weight:650;color:var(--mut);padding:7px 12px 9px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;min-height:38px}
.tab .n{font-size:.76rem;font-weight:700;background:#f2f4f7;border-radius:999px;padding:1px 7px;margin-left:5px;font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);font-weight:850;border-bottom-color:var(--red)}
.tab.on .n{background:#0a0c10;color:#fff}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:170px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;font-size:.95rem;background:#fff;font-family:inherit}
.qseg{display:inline-flex;background:#ececea;border-radius:999px;padding:3px;gap:2px}
.qseg button{border:0;background:none;font-family:inherit;font-size:.85rem;font-weight:650;color:var(--mut);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:30px}
.qseg button.on{background:#0a0c10;color:#fff;font-weight:800}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;min-height:32px;color:var(--ink);font-weight:550;font-family:inherit}
.chip.on{background:#0a0c10;color:#fff;border-color:#0a0c10;font-weight:750}
.chip .n{font-size:.74rem;opacity:.65;font-variant-numeric:tabular-nums}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.flabel{font-size:.76rem;color:var(--mut);font-weight:750;min-width:3.4em}
.subchip{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fres{margin-left:auto;font-size:.84rem;color:var(--mut);font-weight:650}
.fclear{margin-left:auto;background:none;border:0;color:var(--red);font-weight:750;cursor:pointer;font-size:.86rem;min-height:32px;font-family:inherit}
.fres+.fclear{margin-left:8px}
.dayhead{position:sticky;top:var(--barh,120px);z-index:10;display:flex;align-items:baseline;gap:12px;padding:24px 0 10px;background:var(--bg)}
.dayhead .dnum{font-size:2.3rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.dayhead .dmeta{font-size:1rem;font-weight:750}
.dayhead .drel{font-size:.78rem;font-weight:800;color:#fff;background:var(--red);border-radius:7px;padding:3px 10px}
.dayhead .drel.future{background:#0a0c10}
.dayhead .ongoing{font-size:.78rem;font-weight:800;color:#fff;background:var(--amber);border-radius:7px;padding:3px 10px}
.ev{display:flex;gap:18px;margin-bottom:14px}
.rail{flex:0 0 78px;text-align:right;padding-top:22px}
.rail .t1{font-size:1.2rem;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.2}
.rail .t2{font-size:.78rem;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:2px}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 14px;box-shadow:var(--shadow)}
.cinner{display:flex;gap:16px}
.thumb{flex:0 0 112px;width:112px;height:112px;object-fit:cover;border-radius:12px;background:#f2f4f7}
.cbody{flex:1;min-width:0}
.trow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-size:1.18rem;font-weight:820;line-height:1.4;flex:1;min-width:0}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.titlezh{font-size:.93rem;color:#344054;font-weight:650;margin-top:2px}
.fee{flex:0 0 auto;font-size:.86rem;font-weight:900;border-radius:999px;padding:5px 13px;margin-top:2px;white-space:nowrap}
.fee.free{background:#dcfae6;color:var(--green)}
.fee.paid{background:#fef0c7;color:var(--amber)}
.fee.na{background:#f2f4f7;color:var(--mut);font-weight:600}
.loc{font-size:.95rem;color:#344054;margin:6px 0 2px}
.loc .pin{color:var(--red)}
.meta{font-size:.83rem;color:var(--mut);line-height:1.7}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px}
.tag{font-size:.75rem;font-weight:650;background:#f2f4f7;border-radius:8px;padding:3px 10px;color:#344054}
.sum{font-size:.93rem;line-height:1.6;margin:7px 0 0;color:#1d2939;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:7px 15px;border-radius:11px;font-size:.89rem;font-weight:700;text-decoration:none;border:1px solid var(--line);color:#344054;background:#fff}
.btn.primary{background:#0a0c10;color:#fff;border-color:#0a0c10}
.btn.nav{background:#f0f9ff;border-color:#bfe3ff;color:#026aa2}
.subcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin:28px 0 6px;box-shadow:var(--shadow)}
.subcard h3{margin:0 0 10px;font-size:1.18rem;font-weight:820}
.subcard .prompt{background:#f2f4f7;border-radius:12px;padding:14px 16px;font-size:.92rem;line-height:1.7}
.foot{font-size:.83rem;color:var(--mut);padding:26px 0 50px;line-height:2}
.foot a{color:var(--blue)}
.empty{padding:46px 0;text-align:center;color:var(--mut)}
@media (max-width:640px){
.wrap{padding:0 16px}
header{padding:16px 0 12px}
.bar{margin:0 -16px;padding:8px 16px 7px}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 9px 8px;font-size:.9rem}
input[type=search]{font-size:16px}
.dayhead .dnum{font-size:1.9rem}
.dayhead{padding:18px 0 8px}
.ev{flex-direction:column;gap:0;margin-bottom:12px}
.rail{flex:none;text-align:left;padding:0 0 3px;display:flex;gap:9px;align-items:baseline}
.rail .t1{font-size:1.02rem}.rail .t2{font-size:.8rem;margin-top:0}
.card{padding:14px}
.thumb{flex-basis:84px;width:84px;height:84px}
.cinner{gap:12px}
.btn{min-height:40px;padding:7px 13px;font-size:.87rem}
}
</style>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

<body>
<header><div class="wrap">
<div class="hrow">
<h1>SZMeetups <span class="mirror">· Agent Mirror</span></h1>
<span class="langseg" id="g-lang"><button data-v="zh">中文</button><button data-v="en">EN</button></span>
</div>
<p class="tagline" id="tagline"></p>
<div class="statsline" id="st-line">Loading…</div>
</div></header>
<div class="agentbar"><div class="wrap">
<p id="agentbar-p"></p>
<button class="copybtn" onclick="copyPrompt(this)"></button>
</div></div>

<div class="wrap">
<div class="bar">
<div class="tabs" id="g-tabs"></div>
<div class="frow">
<input type="search" id="q" placeholder="">
<span class="qseg" id="g-quick">
<button data-v="all" class="on"></button><button data-v="today"></button><button data-v="weekend"></button>
</span>
<button class="chip" id="g-free"></button>
</div>
<div class="fgroup" id="row-subs" hidden><span class="flabel" id="label-type"></span><span id="g-subs" style="display:contents"></span></div>
<div class="fgroup"><span class="flabel" id="label-area"></span><span id="g-areas" style="display:contents"></span><span class="fres" id="fres"></span><button id="fclear" class="fclear" hidden></button></div>
</div>
<div id="list"><div class="empty">Loading…</div></div>

<div class="subcard" id="agent-sub">
<h3 id="sub-h"></h3>
<p class="sum" id="sub-intro"></p>
<p class="prompt" id="subprompt"></p>
<div class="actions"><button class="btn primary copybtn" onclick="copyPrompt(this)"></button></div>
</div>

<div class="foot" id="foot"></div>
</div>

<script>
let DATA=[];
let F={major:null,subs:new Set(),areas:new Set(),quick:"all",free:false};
let UPD=null;
const $=s=>document.querySelector(s);
const DAY=864e5, SH=8*3600e3;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------- i18n ---------- */
const PROMPT_EN=`Please subscribe to the "SZMeetups Agent Mirror" and remind me about Shenzhen events: data source https://yatstudio.github.io/szmeetups-agent/events.json (updated daily, no login needed; it is an unofficial mirror of szmeetups.com). Fetch it once a day and filter by my interests and my area. Tell me the same day when a new event matches my interests; for events I say I want to attend, remind me 3 days before and 1 day before they start. Never invent events that are not in the data, and always include the original szmeetups.com event link.`;
const PROMPT_ZH=`请订阅「SZMeetups Agent 镜像」并给我深圳活动提醒：数据源 https://yatstudio.github.io/szmeetups-agent/events.json（每天更新，无需登录；这是 szmeetups.com 的非官方镜像）。每天读取一次，按我的兴趣和所在区域筛选；有新活动符合我的兴趣时当天告诉我；我标记想参加的活动，开始前 3 天和前 1 天各提醒我一次。不要编造数据源里没有的活动，提醒时附上 szmeetups.com 的原始活动链接。`;
const STRINGS={
en:{tagline:`<b>What's on in Shenzhen</b> — meetups · shows &amp; nightlife · exhibitions · trade shows, mirrored from <b>szmeetups.com</b> for humans and AI agents, updated daily.`,
agentbar:`🤖 <b>Don't browse — delegate.</b> Copy the subscription prompt to your Agent and get Shenzhen event reminders matched to your interests.`,
copy:"Copy Agent prompt",copied:"Copied ✓",
searchPh:"Search events / venues / organisers…",
quick:{all:"All time",today:"Today",weekend:"This weekend"},freeOnly:"Free only",
labelType:"Type",labelArea:"Area",clear:"Clear all ✕",
allTab:"All",results:n=>n+" events",
empty:"No events match.",loading:"Loading…",loadFail:"Failed to load data — please refresh.",
onNow:"On now",ongoing:"ONGOING",
rel:["Today","Tomorrow","Day after"],
venueTbc:"Venue TBC",tbc:"TBC",
feeFree:"Free",feeNa:"Price: see page",
sessions:n=>` · 🔁 ${n} sessions`,
details:"Details on SZMeetups →",cal:"＋ Calendar",amap:"Amap",gmaps:"Google Maps",
subH:"🤖 Let your Agent watch this for you",
subIntro:"Copy this to your Agent (Codex / Muse / Hermes / Globot — any agent with web access):",
stats:(t,f,u)=>`<b>${t}</b> upcoming · <b>${f}</b> free · updated ${u}`,
foot:`Data feeds (open, no login): <a href="events.json">events.json</a> · <a href="feed.xml">RSS</a> · <a href="events.ics">Calendar .ics</a> · <a href="llms.txt">llms.txt</a> · <a href="agent.json">agent.json</a> · Agent protocol: <a href="https://github.com/yatstudio/szmeetups-agent/blob/main/AGENTS.md">AGENTS.md</a><br>Unofficial agent-friendly mirror of <a href="https://szmeetups.com" target="_blank" rel="noopener">szmeetups.com</a> — all event data © SZMeetups, always link back to the original event page. Always confirm final details on the original page before going.`},
zh:{tagline:`<b>深圳有什么好玩的</b> —— 聚会 · 演出与夜生活 · 展览 · 展会，镜像自 <b>szmeetups.com</b>，供真人与 AI Agent 使用，每天更新。`,
agentbar:`🤖 <b>别自己刷——交给你的 Agent。</b>把订阅话术复制给你的 Agent，按你的兴趣给你推送深圳活动提醒。`,
copy:"复制 Agent 订阅话术",copied:"已复制 ✓",
searchPh:"搜索活动 / 地点 / 主办方…",
quick:{all:"全部时间",today:"今天",weekend:"本周末"},freeOnly:"只看免费",
labelType:"子类",labelArea:"区域",clear:"清除筛选 ✕",
allTab:"全部",results:n=>n+" 个活动",
empty:"没有符合条件的活动。",loading:"加载中…",loadFail:"数据加载失败——请刷新重试。",
onNow:"正在进行",ongoing:"进行中",
rel:["今天","明天","后天"],
venueTbc:"地点待定",tbc:"待定",
feeFree:"免费",feeNa:"票价见原站",
sessions:n=>` · 🔁 共 ${n} 场`,
details:"在 SZMeetups 看详情 →",cal:"＋ 日历",amap:"高德地图",gmaps:"谷歌地图",
subH:"🤖 让你的 Agent 帮你盯着",
subIntro:"把下面这段话复制给你的 Agent（Codex / Muse / Hermes / Globot——任何能联网的 Agent 都可以）：",
stats:(t,f,u)=>`<b>${t}</b> 个即将开始 · <b>${f}</b> 个免费 · 更新于 ${u}`,
foot:`数据接口（开放、无需登录）：<a href="events.json">events.json</a> · <a href="feed.xml">RSS</a> · <a href="events.ics">日历 .ics</a> · <a href="llms.txt">llms.txt</a> · <a href="agent.json">agent.json</a> · Agent 协议：<a href="https://github.com/yatstudio/szmeetups-agent/blob/main/AGENTS.md">AGENTS.md</a><br><a href="https://szmeetups.com" target="_blank" rel="noopener">szmeetups.com</a> 的非官方 Agent 友好镜像——全部活动数据 © SZMeetups，请始终回链原始活动页。出发前请在原站确认最终信息。`}
};
const CAT_ZH={"Meetups":"聚会活动","Shows & Nightlife":"演出与夜生活","Around Town":"城市生活","Trade Shows":"展会","Trade Shows & Conferences":"展会","Language Exchange":"语言交换","Exhibition":"展览","Indie":"独立音乐","Business":"商务","Party":"派对","Concerts":"演唱会","Festival":"节庆活动","Comedy":"喜剧","DJ":"DJ","Jazz":"爵士","Pub Quiz":"酒吧问答","Sports & Fitness":"运动健身","Sports":"运动","Dance":"舞蹈","Dance Fitness":"舞蹈健身","Social":"社交","Market":"市集","Family":"亲子","Live Music":"现场音乐","Nightlife":"夜生活","Sporting Event":"体育赛事","Tech & Startups":"科技创业"};
const AREA_ZH={"Futian":"福田","Nanshan":"南山","Shekou":"蛇口","OCT":"华侨城","Luohu":"罗湖","Bao'an":"宝安","Longgang":"龙岗","Longhua":"龙华"};
const WD_ZH=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
let LANG=(()=>{try{const s=localStorage.getItem("szm-lang");if(s==="zh"||s==="en")return s}catch(e){} return (navigator.language||"en").toLowerCase().startsWith("zh")?"zh":"en"})();

const fmtT=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
const normMajor=m=>!m?"Other":(m.startsWith("Trade Shows")?"Trade Shows":m);
const majorOf=e=>normMajor(e.categories&&e.categories[0]);
const catName=c=>LANG==="zh"?(CAT_ZH[c]||c):c;
const areaName=a=>LANG==="zh"?(AREA_ZH[a]||a):a;
const S=()=>STRINGS[LANG];
function relDiff(t){return Math.round((new Date(dayKey(t))-new Date(dayKey(Date.now())))/DAY)}
function feeBadge(e){
  const f=(e.fee||"").trim();
  if(!f)return `<span class="fee na">${S().feeNa}</span>`;
  if(f==="Free")return `<span class="fee free">${S().feeFree}</span>`;
  return `<span class="fee paid">${esc(f)}</span>`;
}
function quickPass(e){
  if(F.quick==="all")return true;
  if(!e.start)return false;
  const s=new Date(e.start).getTime(), en=e.end?new Date(e.end).getTime():s+2*3600e3;
  const now=Date.now(), today0=Math.floor((now+SH)/DAY)*DAY-SH;
  if(F.quick==="today")return s<today0+DAY&&en>=today0;
  const dow=new Date(now+SH).getUTCDay();
  const satOff=dow===0?-1:(6-dow);
  const wk0=today0+satOff*DAY;
  return s<wk0+2*DAY&&en>=wk0;
}
function pass(e){
  const q=$("#q").value.trim().toLowerCase();
  if(q&&!(e.title+" "+(e.title_zh||"")+" "+(e.organizer||"")+" "+(e.venue||"")+" "+(e.summary||"")+" "+(e.summary_zh||"")).toLowerCase().includes(q))return false;
  if(F.major&&majorOf(e)!==F.major)return false;
  if(F.subs.size&&!(e.categories&&F.subs.has(e.categories[1])))return false;
  if(F.areas.size&&!F.areas.has(e.area))return false;
  if(F.free&&e.fee!=="Free")return false;
  return quickPass(e);
}
function maps(e){
  if(!e.venue)return"";
  const q=encodeURIComponent(["Shenzhen",e.venue,e.address].filter(Boolean).join(" "));
  return `<a class="btn nav" target="_blank" rel="noopener" href="https://uri.amap.com/search?keyword=${q}">${S().amap}</a>`+
  `<a class="btn nav" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">${S().gmaps}</a>`;
}
function cardOf(e){
  const tags=e.categories.map(c=>`<span class="tag">${esc(catName(c))}</span>`).join("");
  const occ=e.occurrences_count>1?S().sessions(e.occurrences_count):"";
  const lang=e.languages&&e.languages.length?` · 🗣 ${esc(e.languages.join(" / "))}`:"";
  let title,sub="";
  if(LANG==="zh"&&e.title_zh){title=e.title_zh;if(e.title&&e.title!==e.title_zh)sub=`<div class="titlezh">${esc(e.title)}</div>`}
  else{title=e.title;if(e.title_zh&&e.title_zh!==e.title)sub=`<div class="titlezh">${esc(e.title_zh)}</div>`}
  const sum=(LANG==="zh"?(e.summary_zh||e.summary):e.summary)||"";
  return `<div class="ev">
<div class="rail"><div class="t1">${e.start?fmtT(e.start):S().tbc}</div><div class="t2">${e.end?"– "+fmtT(e.end):""}</div></div>
<div class="card"><div class="cinner">
${e.image?`<img class="thumb" src="${esc(e.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}
<div class="cbody">
<div class="trow"><h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(title)}</a></h3>${feeBadge(e)}</div>
${sub}
<div class="loc"><span class="pin">📍</span> <b>${esc(e.venue||S().venueTbc)}</b>${e.area&&e.area!=="Shenzhen"?" · "+esc(areaName(e.area)):""}${e.district?" · "+esc(e.district):""}</div>
<div class="meta">${esc(e.organizer||"")}${occ}${lang}</div>
<div class="tags">${tags}</div>
${sum?`<p class="sum">${esc(sum)}</p>`:""}
<div class="actions">
<a class="btn primary" href="${esc(e.url)}" target="_blank" rel="noopener">${S().details}</a>
${e.calendar_url?`<a class="btn" href="${esc(e.calendar_url)}">${S().cal}</a>`:""}
${maps(e)}
</div>
</div></div></div>
</div>`;
}
function render(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const evs=DATA.filter(pass).sort((a,b)=>new Date(a.start||"2100")-new Date(b.start||"2100"));
  const fr=$("#fres");if(fr)fr.textContent=S().results(evs.length);
  $("#fclear").hidden=!(F.major||F.subs.size||F.areas.size||F.quick!=="all"||F.free||$("#q").value.trim());
  if(!evs.length){$("#list").innerHTML=`<div class="empty">${S().empty}</div>`;return}
  let html="",lastKey=null,lastOngoing=null;
  for(const e of evs){
    if(!e.start)continue;
    const ongoing=new Date(e.start)<t0;
    const dk=ongoing?"ongoing":dayKey(e.start);
    if(dk!==lastKey){
      lastKey=dk;
      if(ongoing){
        if(lastOngoing!=="shown"){html+=`<div class="dayhead"><span class="dmeta">${S().onNow}</span><span class="ongoing">${S().ongoing}</span></div>`;lastOngoing="shown"}
      }else{
        const d=new Date(e.start),diff=relDiff(e.start),rel=diff>=0&&diff<=2?S().rel[diff]:"";
        const meta=LANG==="zh"?`${d.getMonth()+1}月${d.getDate()}日 · ${WD_ZH[d.getDay()]}`:`${d.toLocaleDateString("en-GB",{month:"short"})} · ${d.toLocaleDateString("en-GB",{weekday:"long"})}`;
        html+=`<div class="dayhead"><span class="dnum">${d.getDate()}</span><span class="dmeta">${meta}</span>${rel?`<span class="drel ${diff===0?"":"future"}">${rel}</span>`:""}</div>`;
      }
    }
    html+=cardOf(e);
  }
  $("#list").innerHTML=html;
}
function renderTabs(){
  const majors=["Meetups","Shows & Nightlife","Around Town","Trade Shows"];
  const counts={};
  DATA.forEach(e=>{const m=majorOf(e);counts[m]=(counts[m]||0)+1});
  const extra=Object.keys(counts).filter(m=>!majors.includes(m)).sort();
  const allMajors=majors.filter(m=>counts[m]).concat(extra);
  $("#g-tabs").innerHTML=`<button class="tab${F.major?"":" on"}" data-v="__all">${S().allTab}<span class="n">${DATA.length}</span></button>`+
    allMajors.map(m=>`<button class="tab${F.major===m?" on":""}" data-v="${esc(m)}">${esc(catName(m))}<span class="n">${counts[m]}</span></button>`).join("");
}
function renderAreas(){
  const areas=[...new Set(DATA.map(e=>e.area))].filter(a=>a&&a!=="Shenzhen");
  const order=["Futian","Nanshan","Shekou","OCT","Luohu","Bao'an","Longgang","Longhua"];
  areas.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  $("#g-areas").innerHTML=areas.map(a=>`<button class="chip${F.areas.has(a)?" on":""}" data-v="${esc(a)}">${esc(areaName(a))}</button>`).join("");
}
function renderSubs(){
  const row=$("#row-subs"), box=$("#g-subs");
  if(!F.major){row.hidden=true;box.innerHTML="";return}
  const counts={};
  DATA.filter(e=>majorOf(e)===F.major).forEach(e=>{const s=e.categories&&e.categories[1];if(s)counts[s]=(counts[s]||0)+1});
  const subs=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!subs.length){row.hidden=true;box.innerHTML="";return}
  row.hidden=false;
  box.innerHTML=subs.map(s=>`<button class="chip subchip${F.subs.has(s)?" on":""}" data-v="${esc(s)}" title="${esc(s)}">${esc(catName(s))} <span class="n">${counts[s]}</span></button>`).join("");
}
function renderStats(){
  if(!DATA.length)return;
  const free=DATA.filter(e=>e.fee==="Free").length;
  const upd=UPD?new Date(UPD).toLocaleString(LANG==="zh"?"zh-CN":"en-GB",{month:LANG==="zh"?"numeric":"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}):"–";
  $("#st-line").innerHTML=S().stats(DATA.length,free,esc(upd));
}
function applyLang(){
  const t=S();
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.querySelectorAll("#g-lang button").forEach(b=>b.classList.toggle("on",b.dataset.v===LANG));
  $("#tagline").innerHTML=t.tagline;
  $("#agentbar-p").innerHTML=t.agentbar;
  document.querySelectorAll(".copybtn").forEach(b=>b.textContent=t.copy);
  $("#q").placeholder=t.searchPh;
  document.querySelectorAll("#g-quick button").forEach(b=>b.textContent=t.quick[b.dataset.v]);
  $("#g-free").textContent=t.freeOnly;
  $("#label-type").textContent=t.labelType;
  $("#label-area").textContent=t.labelArea;
  $("#fclear").textContent=t.clear;
  $("#sub-h").textContent=t.subH;
  $("#sub-intro").textContent=t.subIntro;
  $("#subprompt").textContent=LANG==="zh"?PROMPT_ZH:PROMPT_EN;
  $("#foot").innerHTML=t.foot;
  renderTabs();renderAreas();renderSubs();renderStats();render();measureBar();
}
window.copyPrompt=b=>{if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById("subprompt").innerText).then(()=>{const t=b.textContent;b.textContent=S().copied;setTimeout(()=>b.textContent=S().copy,1500)})};
function measureBar(){const b=document.querySelector(".bar");if(b)document.documentElement.style.setProperty("--barh",b.offsetHeight+"px")}
window.addEventListener("resize",measureBar);
$("#g-lang").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b||b.dataset.v===LANG)return;
  LANG=b.dataset.v;
  try{localStorage.setItem("szm-lang",LANG)}catch(e){}
  applyLang();
});
$("#g-tabs").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  F.major=b.dataset.v==="__all"?null:b.dataset.v;
  F.subs.clear();
  renderTabs();renderSubs();render();measureBar();
});
$("#g-subs").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  const v=b.dataset.v;
  if(F.subs.has(v))F.subs.delete(v);else F.subs.add(v);
  b.classList.toggle("on",F.subs.has(v));
  render();measureBar();
});
$("#g-areas").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  const v=b.dataset.v;
  if(F.areas.has(v))F.areas.delete(v);else F.areas.add(v);
  b.classList.toggle("on",F.areas.has(v));
  render();measureBar();
});
$("#g-quick").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  F.quick=b.dataset.v;
  document.querySelectorAll("#g-quick button").forEach(x=>x.classList.toggle("on",x===b));
  render();measureBar();
});
$("#g-free").addEventListener("click",()=>{
  F.free=!F.free;
  $("#g-free").classList.toggle("on",F.free);
  render();measureBar();
});
$("#fclear").addEventListener("click",()=>{
  F={major:null,subs:new Set(),areas:new Set(),quick:"all",free:false};$("#q").value="";
  document.querySelectorAll("#g-quick button").forEach((x,i)=>x.classList.toggle("on",i===0));
  $("#g-free").classList.remove("on");
  renderTabs();renderAreas();renderSubs();render();measureBar();
});
$("#q").addEventListener("input",()=>{render();measureBar()});
$("#list").innerHTML=`<div class="empty">${S().loading}</div>`;
applyLang();
fetch("events.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  DATA=j.events||[];
  UPD=j.updated_at||null;
  applyLang();setTimeout(measureBar,400);
}).catch(()=>{$("#list").innerHTML=`<div class="empty">${S().loadFail}</div>`});
</script>
</body>
</html>
